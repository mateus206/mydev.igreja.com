<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gestão de Utilizadores</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">

    <div>
      <h2 class="fw-bold mb-1">Gestão de Utilizadores</h2>
      <p class="text-muted mb-0">Gestão completa dos utilizadores da plataforma</p>
    </div>

    <a href="Backoffice.html" class="btn btn-secondary">
      Voltar
    </a>

  </div>

  <!-- BOTÃO -->
  <button class="btn btn-primary w-100 mb-4" onclick="abrirModalAdicionar()">
    <i class="bi bi-plus-lg"></i> Adicionar Utilizador
  </button>

  <!-- CARD -->
  <div class="card shadow-sm">

    <div class="card-body">

      <!-- TÍTULO -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Utilizadores</h5>
        <small class="text-muted" id="total-utilizadores">0 utilizadores</small>
      </div>

      <!-- PESQUISA -->
      <input
        type="text"
        class="form-control mb-3"
        id="searchInput"
        placeholder="Procurar por nome ou email..."
        oninput="filtrar()"
      >

      <!-- TABELA -->
      <div class="table-responsive">

        <table class="table table-hover align-middle" id="tabela-utilizadores">

          <thead class="table-light">
            <tr>
              <th>Nome</th>
              <th>Email</th>
              <th>Data</th>
              <th>Estado</th>
              <th class="text-center">Pedidos</th>
              <th class="text-center">Ações</th>
            </tr>
          </thead>

          <tbody></tbody>

        </table>

      </div>

    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal fade" id="modalForm">
  <div class="modal-dialog">

    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modalTitulo">Utilizador</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <input id="inputNome" class="form-control mb-2" placeholder="Nome">
        <input id="inputEmail" class="form-control mb-2" placeholder="Email">

        <select id="inputEstado" class="form-select">
          <option value="true">Ativo</option>
          <option value="false">Inativo</option>
        </select>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarUtilizador()">Guardar</button>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
let utilizadores = [
  { id: 1, nome: "João Silva", email: "joao@email.com", data: "2025-11-15", ativo: true, pedidos: 12 },
  { id: 2, nome: "Maria Santos", email: "maria@email.com", data: "2026-01-08", ativo: true, pedidos: 3 }
];

let editando = null;
let modal;

document.addEventListener("DOMContentLoaded", () => {
  modal = new bootstrap.Modal(document.getElementById("modalForm"));
  render();
});

function render(lista = utilizadores) {

  const tbody = document.querySelector("#tabela-utilizadores tbody");
  tbody.innerHTML = "";

  lista.forEach(u => {

    tbody.innerHTML += `
      <tr>
        <td>${u.nome}</td>
        <td>${u.email}</td>
        <td>${u.data}</td>

        <td>
          <span class="badge ${u.ativo ? 'bg-success' : 'bg-danger'}">
            ${u.ativo ? 'Ativo' : 'Inativo'}
          </span>
        </td>

        <td class="text-center">${u.pedidos}</td>

        <td class="text-center">
          <button class="btn btn-sm btn-outline-primary" onclick="editar(${u.id})">
            <i class="bi bi-pencil"></i>
          </button>

          <button class="btn btn-sm btn-outline-danger" onclick="eliminar(${u.id})">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    `;
  });

  document.getElementById("total-utilizadores").textContent =
    `${lista.length} utilizadores`;
}

function filtrar() {
  const q = searchInput.value.toLowerCase();
  render(utilizadores.filter(u =>
    u.nome.toLowerCase().includes(q) ||
    u.email.toLowerCase().includes(q)
  ));
}

function abrirModalAdicionar() {
  editando = null;
  modal.show();

  inputNome.value = "";
  inputEmail.value = "";
  inputEstado.value = "true";
}

function editar(id) {
  const u = utilizadores.find(x => x.id === id);
  editando = id;

  inputNome.value = u.nome;
  inputEmail.value = u.email;
  inputEstado.value = String(u.ativo);

  modal.show();
}

function guardarUtilizador() {

  const nome = inputNome.value.trim();
  const email = inputEmail.value.trim();
  const ativo = inputEstado.value === "true";

  if (!nome || !email) return;

  if (editando) {

    const u = utilizadores.find(x => x.id === editando);
    u.nome = nome;
    u.email = email;
    u.ativo = ativo;

  } else {

    utilizadores.push({
      id: Date.now(),
      nome,
      email,
      data: new Date().toISOString().split("T")[0],
      ativo,
      pedidos: 0
    });
  }

  modal.hide();
  render();
}

function eliminar(id) {
  utilizadores = utilizadores.filter(x => x.id !== id);
  render();
}
</script>

</body>
</html>
