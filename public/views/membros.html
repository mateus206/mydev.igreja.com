<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gestão de Membros</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">

    <div>
      <h2 class="fw-bold mb-1">Gestão de Membros</h2>
      <p class="text-muted mb-0">
        Registo e gestão dos membros da instituição
      </p>
    </div>

    <a href="Backoffice.html" class="btn btn-secondary">
      Voltar
    </a>

  </div>

  <!-- BOTÃO -->
  <button class="btn btn-primary w-100 mb-4">
    <i class="bi bi-plus-lg"></i> Adicionar Membro
  </button>

  <!-- CARD -->
  <div class="card shadow-sm">

    <div class="card-body">

      <!-- TÍTULO -->
      <div class="d-flex justify-content-between align-items-center mb-3">

        <h5 class="mb-0">Lista de Membros</h5>

        <small class="text-muted">
          4 membros registados
        </small>

      </div>

      <!-- PESQUISA -->
      <input
        type="text"
        class="form-control mb-3"
        placeholder="Procurar por nome, email ou função..."
      >

      <!-- TABELA -->
      <div class="table-responsive">

        <table class="table table-hover align-middle">

          <thead class="table-light">
            <tr>
              <th></th>
              <th>Nome</th>
              <th>Email</th>
              <th>Telefone</th>
              <th>Função</th>
              <th class="text-center">Ações</th>
            </tr>
          </thead>

          <tbody>

            <!-- MEMBRO -->
            <tr>

              <td>
                <input type="checkbox" class="form-check-input">
              </td>

              <td>Yuri</td>
              <td>yuri@gmail.com</td>
              <td>+55 11 99282-7989</td>

              <td>
                <span class="badge bg-primary rounded-pill">
                  Membro
                </span>
              </td>

              <td class="text-center">

                <button class="btn btn-sm btn-outline-primary">
                  <i class="bi bi-pencil"></i>
                </button>

                <button class="btn btn-sm btn-outline-danger ms-1">
                  <i class="bi bi-trash"></i>
                </button>

              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
