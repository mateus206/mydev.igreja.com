<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gestão de Doações</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

  <!-- CABEÇALHO -->
  <div class="d-flex justify-content-between align-items-center mb-4">

    <div>
      <h2 class="fw-bold mb-1">Gestão de Doações</h2>
      <p class="text-muted mb-0">
        Registar e gerir doações
      </p>
    </div>

    <a href="Backoffice.html" class="btn btn-secondary">
      <i class="bi bi-arrow-left"></i> Voltar
    </a>

  </div>

  <!-- BOTÃO ADICIONAR -->
  <div class="mb-4">
    <button class="btn btn-primary w-100">
      <i class="bi bi-plus-lg"></i> Adicionar Doação
    </button>
  </div>

  <!-- CARD -->
  <div class="card shadow-sm border-0">

    <div class="card-body">

      <!-- TÍTULO -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0">Lista de Doações</h5>

        <small class="text-muted">
          4 doações registadas
        </small>
      </div>

      <!-- PESQUISA -->
      <div class="input-group mb-4">

        <span class="input-group-text">
          <i class="bi bi-search"></i>
        </span>

        <input
          type="text"
          class="form-control"
          placeholder="Pesquisar doações..."
        >

      </div>

      <!-- TABELA -->
      <div class="table-responsive">

        <table class="table table-hover align-middle">

          <thead class="table-light">
            <tr>
              <th>Doador</th>
              <th>Tipo</th>
              <th>Data</th>
              <th>Valor</th>
              <th>Estado</th>
              <th class="text-center">Ações</th>
            </tr>
          </thead>

          <tbody>

            <!-- LINHA -->
            <tr>
              <td>Maria Silva</td>
              <td>Dinheiro</td>
              <td>02/12/2026</td>
              <td>500€</td>

              <td>
                <span class="badge bg-success rounded-pill">
                  Recebida
                </span>
              </td>

              <td class="text-center">

                <button class="btn btn-sm btn-outline-primary">
                  <i class="bi bi-pencil"></i>
                </button>

                <button class="btn btn-sm btn-outline-danger ms-1">
                  <i class="bi bi-trash"></i>
                </button>

              </td>
            </tr>

            <!-- LINHA -->
            <tr>
              <td>João Pereira</td>
              <td>Alimentos</td>
              <td>02/15/2026</td>
              <td>-</td>

              <td>
                <span class="badge bg-warning text-dark rounded-pill">
                  Pendente
                </span>
              </td>

              <td class="text-center">

                <button class="btn btn-sm btn-outline-primary">
                  <i class="bi bi-pencil"></i>
                </button>

                <button class="btn btn-sm btn-outline-danger ms-1">
                  <i class="bi bi-trash"></i>
                </button>

              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
