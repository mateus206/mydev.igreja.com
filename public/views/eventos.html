<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eventos</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">

    <div>
      <h2 class="fw-bold mb-1">Gestão de Eventos</h2>
      <p class="text-muted mb-0">Gestão completa dos eventos</p>
    </div>

    <a href="Backoffice.html" class="btn btn-secondary">
      <i class="bi bi-arrow-left"></i> Voltar
    </a>

  </div>

  <!-- BOTÃO -->
  <button class="btn btn-primary w-100 mb-4" onclick="abrirModalAdicionar()">
    <i class="bi bi-plus-lg"></i> Adicionar Evento
  </button>

  <!-- CARD -->
  <div class="card shadow-sm">

    <div class="card-body">

      <!-- TÍTULO -->
      <div class="d-flex justify-content-between mb-3">
        <h5 class="mb-0">Eventos</h5>
        <small class="text-muted" id="total-eventos">0 eventos</small>
      </div>

      <!-- PESQUISA -->
      <input
        type="text"
        class="form-control mb-3"
        placeholder="Pesquisar eventos..."
        id="searchInput"
        oninput="filtrar()"
      >

      <!-- TABELA -->
      <div class="table-responsive">

        <table class="table table-hover align-middle" id="tabela-eventos">

          <thead class="table-light">
            <tr>
              <th>Título</th>
              <th>Data</th>
              <th>Descrição</th>
              <th>Estado</th>
              <th class="text-center">Ações</th>
            </tr>
          </thead>

          <tbody></tbody>

        </table>

      </div>

    </div>

  </div>

</div>

<!-- MODAL -->
<div class="modal fade" id="modalForm">

  <div class="modal-dialog">

    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modalTitulo">Evento</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <input class="form-control mb-2" id="inputTitulo" placeholder="Título">
        <input type="date" class="form-control mb-2" id="inputData">
        <textarea class="form-control mb-2" id="inputDescricao" placeholder="Descrição"></textarea>

        <select class="form-select" id="inputEstado">
          <option value="true">Ativo</option>
          <option value="false">Inativo</option>
        </select>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarEvento()">Guardar</button>
      </div>

    </div>

  </div>

</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

let eventos = [
  { id: 1, titulo: "Culto de Domingo", data: "2026-04-10", descricao: "Culto principal", ativo: true },
  { id: 2, titulo: "Ensaio do Coral", data: "2026-04-12", descricao: "Preparação", ativo: false }
];

let modal = new bootstrap.Modal(document.getElementById("modalForm"));
let editando = null;

function render() {

  const tbody = document.querySelector("#tabela-eventos tbody");
  tbody.innerHTML = "";

  eventos.forEach(e => {

    tbody.innerHTML += `
      <tr>
        <td class="fw-semibold">${e.titulo}</td>
        <td>${e.data}</td>
        <td>${e.descricao}</td>
        <td>
          <span class="badge ${e.ativo ? 'bg-success' : 'bg-danger'}">
            ${e.ativo ? 'Ativo' : 'Inativo'}
          </span>
        </td>
        <td class="text-center">
          <button class="btn btn-sm btn-outline-primary" onclick="editar(${e.id})">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger" onclick="eliminar(${e.id})">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    `;

  });

  document.getElementById("total-eventos").textContent =
    eventos.length + " eventos";
}

function filtrar() {

  const q = document.getElementById("searchInput").value.toLowerCase();

  const filtrados = eventos.filter(e =>
    e.titulo.toLowerCase().includes(q)
  );

  const tbody = document.querySelector("#tabela-eventos tbody");
  tbody.innerHTML = "";

  filtrados.forEach(e => {

    tbody.innerHTML += `
      <tr>
        <td>${e.titulo}</td>
        <td>${e.data}</td>
        <td>${e.descricao}</td>
        <td>
          <span class="badge ${e.ativo ? 'bg-success' : 'bg-danger'}">
            ${e.ativo ? 'Ativo' : 'Inativo'}
          </span>
        </td>
        <td class="text-center">
          <button class="btn btn-sm btn-outline-primary" onclick="editar(${e.id})">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger" onclick="eliminar(${e.id})">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    `;

  });

}

function abrirModalAdicionar() {

  editando = null;

  document.getElementById("modalTitulo").textContent = "Adicionar Evento";

  document.getElementById("inputTitulo").value = "";
  document.getElementById("inputData").value = "";
  document.getElementById("inputDescricao").value = "";
  document.getElementById("inputEstado").value = "true";

  modal.show();
}

function editar(id) {

  const e = eventos.find(x => x.id === id);

  editando = id;

  document.getElementById("modalTitulo").textContent = "Editar Evento";

  document.getElementById("inputTitulo").value = e.titulo;
  document.getElementById("inputData").value = e.data;
  document.getElementById("inputDescricao").value = e.descricao;
  document.getElementById("inputEstado").value = String(e.ativo);

  modal.show();
}

function guardarEvento() {

  const titulo = document.getElementById("inputTitulo").value;

  if (!titulo) return;

  const data = document.getElementById("inputData").value;
  const descricao = document.getElementById("inputDescricao").value;
  const ativo = document.getElementById("inputEstado").value === "true";

  if (editando) {

    const e = eventos.find(x => x.id === editando);
    Object.assign(e, { titulo, data, descricao, ativo });

  } else {

    eventos.push({
      id: Date.now(),
      titulo,
      data,
      descricao,
      ativo
    });

  }

  modal.hide();
  render();
}

function eliminar(id) {
  eventos = eventos.filter(e => e.id !== id);
  render();
}

render();

</script>

</body>
</html>
